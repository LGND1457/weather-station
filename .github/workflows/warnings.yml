name: BOM warnings
# Fetches the Bureau of Meteorology's public Queensland warnings RSS feed
# (personal, non-commercial use; every item links back to bom.gov.au)
# and saves it as warnings.json so the board can read it from its own site.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/warnings.yml"]
permissions:
  contents: write
concurrency:
  group: warnings
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BOM Queensland warnings
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, xml.etree.ElementTree as ET
          url = "http://www.bom.gov.au/fwo/IDZ00056.warnings_qld.xml"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "application/rss+xml, application/xml, text/xml, */*"})
          out = {"ok": False, "fetched": int(time.time()), "source": url, "items": []}
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  root = ET.fromstring(r.read())
              for it in root.iter("item"):
                  out["items"].append({
                      "title": (it.findtext("title") or "").strip(),
                      "link": (it.findtext("link") or "").strip(),
                      "date": (it.findtext("pubDate") or "").strip()})
              out["ok"] = True
          except Exception as e:
              out["error"] = str(e)[:200]
          try:
              old = json.load(open("warnings.json"))
          except Exception:
              old = None
          # keep the last good copy if this fetch failed
          if not out["ok"] and old and old.get("ok"):
              old["lastError"] = out.get("error"); old["lastTry"] = out["fetched"]
              out = old
          json.dump(out, open("warnings.json", "w"), indent=1)
          print(out.get("ok"), len(out["items"]), out.get("error", ""))
          PY
      - name: Save if changed
        run: |
          git config user.name "wx-station-bot"
          git config user.email "LGND1457@users.noreply.github.com"
          git add warnings.json
          # only commit when the warnings change, or hourly to refresh the timestamp
          if ! git diff --cached --quiet; then
            CH=$(git diff --cached -U0 warnings.json | grep -E '^[+-] ' | grep -vE '"(fetched|lastTry|lastError)"' | wc -l)
            if [ "$CH" -gt 0 ] || [ "$(date +%M)" -lt 10 ]; then
              git commit -m "Update BOM warnings" && git push
            fi
          fi
